[package]
name = "nuxtjp-contact-worker"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/nuxtjp/contact-form"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "worker/src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
ipnet = { version = "2.12.2", features = ["serde"] }
url = "2.5.8"
zixcel-microsoft-mail = { git = "https://github.com/zixcel/zixcel-microsoft", rev = "c33b3000ecfd36371b0864adaa6ebffb0dc3c486", version = "=0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
zeroize = "1"
wasm-streams = "=0.7.0"
hmac = "0.12.1"
sha2 = "0.10.9"
futures-util = { version = "0.3.32", default-features = false, features = ["async-await"] }

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
